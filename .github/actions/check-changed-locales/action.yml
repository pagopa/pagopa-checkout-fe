name: Check Changed Locales
description: "Allow only locale key additions/removals in PRs. Existing locale values must not change manually."

runs:
  using: "composite"
  steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: current
    - name: Check for manual value changes
      env:
        BASE_REF: origin/${{ github.base_ref }}
      shell: bash
      run: node .github/actions/check-changed-locales/check-changed-locales.mjs